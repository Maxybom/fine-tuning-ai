name: Windows Testing Branch

on:
  push:
    branches: [ "testing" ]
  pull_request:
    branches: [ "testing" ]

jobs:
  test-scripts:
    runs-on: windows-latest
    steps:
      - name: Checkout Branch Testing
        uses: actions/checkout@v4
        with:
          ref: testing
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' 

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Merge Script
        run: python merge.py

      - name: Quantization
        run: python gguf_convert_quantization.py
